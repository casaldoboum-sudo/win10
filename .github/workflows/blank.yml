name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure main RDP settings
        shell: pwsh
        run: |
          $path = 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
          if (-not (Test-Path $path)) { New-Item -Path $path -Force }
          New-ItemProperty -Path $path -Name "fDenyTSConnections" -Value 0 -PropertyType DWord -Force

          $winpath = "$path\WinStations\RDP-Tcp"
          if (-not (Test-Path $winpath)) { New-Item -Path $winpath -Force }
          New-ItemProperty -Path $winpath -Name "UserAuthentication" -Value 0 -PropertyType DWord -Force
          New-ItemProperty -Path $winpath -Name "SecurityLayer" -Value 0 -PropertyType DWord -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP user with secure password
        shell: pwsh
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ('!@#$+-_'.ToCharArray())
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper   | Get-Random -Count 3
          $rawPassword += $charSet.Lower   | Get-Random -Count 3
          $rawPassword += $charSet.Number  | Get-Random -Count 3
          $rawPassword += $charSet.Special | Get-Random -Count 3

          $password = -join ($rawPassword | Sort-Object { Get-Random })

          & net.exe user RDP "$password" /add /expires:never /passwordchg:no
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Failed to create RDP user"
            exit 1
          }

          net.exe localgroup Administrators RDP /add
          net.exe localgroup "Remote Desktop Users" RDP /add

          "RDP_CREDS=User: RDP | Password: $password" >> $env:GITHUB_ENV

      - name: Install Tailscale MSI
        shell: pwsh
        run: |
          $html = (Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/" -UseBasicParsing).Content
          $msiFile = [regex]::Match($html, 'tailscale-setup-[0-9.]+-amd64\.msi').Value
          $tsUrl = "https://pkgs.tailscale.com/stable/$msiFile"
          $installerPath = "$env:TEMP\$msiFile"

          Write-Host "Downloading $msiFile..."
          curl.exe -L $tsUrl -o $installerPath

          Write-Host "Installing MSI silently..."
          Start-Process -FilePath "msiexec.exe" -ArgumentList "/i `"$installerPath`" /qn /norestart TS_NOLAUNCH=1" -Wait
          Remove-Item $installerPath -Force -ErrorAction SilentlyContinue

      - name: Connect to Tailscale
        shell: pwsh
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if (-not $env:TAILSCALE_AUTHKEY) {
            Write-Error "TAILSCALE_AUTHKEY secret is missing."
            exit 1
          }

          $svc = Get-Service -Name "Tailscale" -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne "Running") {
            Start-Service -Name "Tailscale"
            Start-Sleep -Seconds 3
          }

          $tailscaleExe = "$env:ProgramFiles\Tailscale\tailscale.exe"
          & $tailscaleExe up --authkey=$env:TAILSCALE_AUTHKEY --unattended
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "tailscale up exited with code $LASTEXITCODE"
          }

          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 20) {
            $tsIP = (& $tailscaleExe ip -4 2>$null) | Select-Object -First 1
            if (-not $tsIP) {
              Start-Sleep -Seconds 3
              $retries++
            }
          }

          if (-not $tsIP) {
            Write-Host "=== Tailscale Status ==="
            & $tailscaleExe status 2>&1
            Write-Error "Tailscale IP not assigned. Exiting."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Check RDP accessibility
        shell: pwsh
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"

          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection failed on RDP port 3389"
            exit 1
          }

          Write-Host "TCP connectivity succeeded!"

      - name: Keep runner alive
        shell: pwsh
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"
          Write-Host "$env:RDP_CREDS"
          Write-Host "==================`n"

          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to stop"
            Start-Sleep -Seconds 300
          }
